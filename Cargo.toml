[package]
name = "vim-shapes"
version = "0.1.0"
edition = "2024"
description = "architecture diagrams, driven like vim — a terminal diagramming tool with an ontology under it"

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
